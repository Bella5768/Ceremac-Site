{% extends "admin_panel/confirm_delete.html" %}

{% block content %}
<div class="card">
    <div class="card-header bg-danger">
        <h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirmer la suppression</h4>
    </div>
    <div class="card-body">
        <div class="alert alert-warning">
            <i class="fas fa-exclamation-circle"></i> 
            Êtes-vous sûr de vouloir supprimer la FAQ <strong>{{ faq.question|truncatewords:10 }}</strong> ?
            <br><small>Cette action est irréversible.</small>
        </div>
        
        <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Confirmer la suppression
                </button>
                <a href="{% url 'admin_panel:faqs' %}" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Annuler
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
